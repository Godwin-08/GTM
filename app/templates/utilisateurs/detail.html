{% extends "base.html" %}

{% block page_title %}Détail du compte utilisateur{% endblock %}

{% block content %}

<div x-data="pageUtilisateurDetailData({{ utilisateur_id }})" x-init="charger()">

    <a href="{{ url_for('pages.utilisateurs') }}" class="text-sm text-gray-500 hover:text-gray-700 flex items-center gap-1 mb-4">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Retour aux utilisateurs
    </a>

    <template x-if="chargementEnCours">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-10 text-center text-gray-400 text-sm">
            <i data-lucide="loader-2" class="w-5 h-5 mx-auto mb-2 animate-spin"></i>
            Chargement...
        </div>
    </template>

    <template x-if="erreur">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-10 text-center text-red-500 text-sm">
            <i data-lucide="alert-circle" class="w-5 h-5 mx-auto mb-2"></i>
            <span x-text="erreur"></span>
        </div>
    </template>

    <template x-if="!chargementEnCours && !erreur && utilisateur">
        <div>
            <!-- ============ EN-TÊTE UTILISATEUR ============ -->
            <div class="bg-white rounded-xl border border-gray-200 p-6 mb-6 shadow-sm">
                <div class="flex items-start gap-4">
                    <div class="w-14 h-14 rounded-full bg-primary/10 text-primary font-bold text-lg flex items-center justify-center flex-shrink-0">
                        <span x-text="initiales(utilisateur.nom)"></span>
                    </div>
                    <div class="flex-1">
                        <div class="flex items-start justify-between">
                            <div>
                                <h2 class="text-lg font-semibold text-gray-900" x-text="utilisateur.nom"></h2>
                                <p class="text-sm text-gray-500 mt-0.5" x-text="utilisateur.email"></p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-primary/10 text-primary"
                                      x-text="labelRole(utilisateur.role.nom)"></span>
                                <span class="text-xs font-medium px-2.5 py-1 rounded-full"
                                      :class="utilisateur.actif ? 'bg-success/10 text-success' : 'bg-danger/10 text-danger'"
                                      x-text="utilisateur.actif ? 'Actif' : 'Inactif'"></span>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 pt-4 mt-4 border-t border-gray-100">
                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Date de création</p>
                                <p class="text-sm text-gray-900" x-text="formaterDate(utilisateur.date_creation)"></p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Rôle système</p>
                                <p class="text-sm text-gray-900 capitalize" x-text="utilisateur.role.nom"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ============ FICHE FORMATEUR ASSOCIÉE (SI FORMATEUR) ============ -->
            <template x-if="utilisateur.formateur">
                <div class="bg-white rounded-xl border border-gray-200 p-6">
                    <div class="flex items-center gap-2 mb-4">
                        <i data-lucide="user-check" class="w-5 h-5 text-primary"></i>
                        <h3 class="text-base font-semibold text-gray-900">Fiche Formateur associée</h3>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                        <div>
                            <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Nom formateur</p>
                            <p class="text-sm font-medium text-gray-900" x-text="utilisateur.formateur.nom"></p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Téléphone</p>
                            <p class="text-sm text-gray-900" x-text="utilisateur.formateur.telephone || '—'"></p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Domaine d'expertise</p>
                            <p class="text-sm text-gray-900" x-text="utilisateur.formateur.domaine?.nom || '—'"></p>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>

</div>

{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/utilisateur_detail.js') }}"></script>
{% endblock %}
