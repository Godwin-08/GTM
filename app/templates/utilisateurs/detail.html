{% extends "base.html" %}

{% block page_title %}Détail du compte utilisateur{% endblock %}

{% block content %}

<div x-data="pageUtilisateurDetailData({{ utilisateur_id }})" x-init="charger()">

    <div class="mb-6 flex items-center justify-between">
        <a href="{{ url_for('pages.utilisateurs') }}" class="text-sm font-medium text-gray-500 hover:text-gray-900 flex items-center gap-1.5 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Retour à la liste des utilisateurs
        </a>
    </div>

    <template x-if="chargementEnCours">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-12 text-center text-gray-400 text-sm">
            <i data-lucide="loader-2" class="w-6 h-6 mx-auto mb-2 animate-spin"></i>
            Chargement du compte utilisateur...
        </div>
    </template>

    <template x-if="erreur">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-12 text-center text-red-500 text-sm">
            <i data-lucide="alert-circle" class="w-6 h-6 mx-auto mb-2"></i>
            <span x-text="erreur"></span>
        </div>
    </template>

    <template x-if="!chargementEnCours && !erreur && utilisateur">
        <div class="space-y-6">

            <!-- ============ 1. EN-TÊTE UTILISATEUR ============ -->
            <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                <div class="flex items-start gap-4">
                    <div class="w-14 h-14 rounded-full bg-primary/10 text-primary font-bold text-lg flex items-center justify-center flex-shrink-0">
                        <span x-text="initiales(utilisateur.nom)"></span>
                    </div>
                    <div class="flex-1">
                        <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-2">
                            <div>
                                <h1 class="text-xl font-bold text-gray-900" x-text="utilisateur.nom"></h1>
                                <p class="text-sm text-gray-500 mt-0.5 flex items-center gap-1.5">
                                    <i data-lucide="mail" class="w-3.5 h-3.5 text-gray-400"></i>
                                    <span x-text="utilisateur.email"></span>
                                </p>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-primary/10 text-primary"
                                      x-text="labelRole(utilisateur.role.nom)"></span>
                                <span class="text-xs font-medium px-2.5 py-1 rounded-full inline-flex items-center gap-1"
                                      :class="utilisateur.actif ? 'bg-success/10 text-success' : 'bg-danger/10 text-danger'">
                                    <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
                                    <span x-text="utilisateur.actif ? 'Actif' : 'Inactif'"></span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ============ 2. CARTES KPI / INFOS COMPTE ============ -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Rôle système</p>
                    <p class="text-sm font-semibold text-gray-900 capitalize" x-text="labelRole(utilisateur.role.nom)"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Statut du compte</p>
                    <p class="text-sm font-semibold" :class="utilisateur.actif ? 'text-success' : 'text-danger'" x-text="utilisateur.actif ? 'Compte actif' : 'Compte désactivé'"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Date de création</p>
                    <p class="text-sm font-semibold text-gray-900" x-text="formaterDate(utilisateur.date_creation)"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Fiche formateur</p>
                    <p class="text-sm font-semibold text-gray-900" x-text="utilisateur.formateur ? 'Liée' : 'Non rattachée'"></p>
                </div>
            </div>

            <!-- ============ 3. FICHE FORMATEUR ASSOCIÉE (SI FORMATEUR) ============ -->
            <template x-if="utilisateur.formateur">
                <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                    <div class="flex items-center gap-2 mb-4">
                        <i data-lucide="user-check" class="w-5 h-5 text-primary"></i>
                        <h3 class="text-base font-semibold text-gray-900">Fiche Formateur associée</h3>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 border-t border-gray-100">
                        <div>
                            <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Nom formateur</p>
                            <p class="text-sm font-medium text-gray-900" x-text="utilisateur.formateur.nom"></p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Téléphone</p>
                            <p class="text-sm text-gray-900" x-text="utilisateur.formateur.telephone || '—'"></p>
                        </div>
                        <div>
                            <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Domaine d'expertise</p>
                            <p class="text-sm text-gray-900" x-text="utilisateur.formateur.domaine?.nom || '—'"></p>
                        </div>
                    </div>
                </div>
            </template>

        </div>
    </template>

</div>

{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/utilisateur_detail.js') }}"></script>
{% endblock %}
