<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | GTM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: { DEFAULT: '#F26B1F', hover: '#D95A10' } } } }
        }
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen">

    <div class="bg-white rounded-xl border border-gray-200 p-8 w-full max-w-sm">
        <h1 class="text-lg font-semibold text-gray-900 mb-1">GTM</h1>
        <p class="text-sm text-gray-500 mb-6">Connectez-vous à votre espace.</p>

        <!-- Zone où on affichera un message d'erreur si les identifiants sont mauvais -->
        <p id="erreurLogin" class="text-sm text-red-500 mb-4 hidden"></p>

        <form id="formLogin" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-700 mb-1">Email</label>
                <input type="email" id="email" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
            </div>
            <div>
                <label class="block text-sm text-gray-700 mb-1">Mot de passe</label>
                <input type="password" id="password" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-primary">
            </div>
            <button type="submit"
                    class="w-full bg-primary hover:bg-primary-hover text-white text-sm font-medium py-2 rounded-lg">
                Se connecter
            </button>
        </form>
    </div>

    <script>
        // On intercepte la soumission du formulaire pour appeler l'API en JS
        // plutôt que de laisser le navigateur faire un POST classique,
        // ce qui permet de récupérer une erreur propre sans recharger la page.
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault(); // empêche le rechargement de page par défaut

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const erreurEl = document.getElementById('erreurLogin');
            erreurEl.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // credentials: 'include' garantit que le cookie de session
                    // renvoyé par Flask est bien stocké par le navigateur
                    credentials: 'include',
                    body: JSON.stringify({ email, mot_de_passe: password })
                });

                if (!res.ok) {
                    throw new Error('Identifiants incorrects');
                }

                // Connexion réussie -> on redirige vers le dashboard
                window.location.href = '/dashboard';

            } catch (err) {
                erreurEl.textContent = 'Email ou mot de passe incorrect.';
                erreurEl.classList.remove('hidden');
            }
        });
    </script>

</body>
</html>
