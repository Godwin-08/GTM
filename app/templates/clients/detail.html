{% extends "base.html" %}

{% block page_title %}Détail du client{% endblock %}

{% block content %}

<div x-data="pageClientDetailData({{ client_id }})" x-init="charger()">

    <div class="mb-6 flex items-center justify-between">
        <a href="{{ url_for('pages.clients') }}" class="text-sm font-medium text-gray-500 hover:text-gray-900 flex items-center gap-1.5 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Retour à la liste des clients
        </a>
    </div>

    <template x-if="chargementEnCours">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-12 text-center text-gray-400 text-sm">
            <i data-lucide="loader-2" class="w-6 h-6 mx-auto mb-2 animate-spin"></i>
            Chargement de la fiche client...
        </div>
    </template>

    <template x-if="erreur">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-12 text-center text-red-500 text-sm">
            <i data-lucide="alert-circle" class="w-6 h-6 mx-auto mb-2"></i>
            <span x-text="erreur"></span>
        </div>
    </template>

    <template x-if="!chargementEnCours && !erreur && client">
        <div class="space-y-6">

            <!-- ============ 1. EN-TÊTE DU COMPTE CLIENT ============ -->
            <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-3">
                            <h1 class="text-xl font-bold text-gray-900" x-text="client.nom_entreprise"></h1>
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium"
                                  :class="{
                                      'bg-success/10 text-success': client.statut_activite === 'actif',
                                      'bg-warning/10 text-warning': client.statut_activite === 'inactif',
                                      'bg-gray-100 text-gray-500': client.statut_activite === 'aucune'
                                  }">
                                <span class="w-1.5 h-1.5 rounded-full"
                                      :class="{
                                          'bg-success': client.statut_activite === 'actif',
                                          'bg-warning': client.statut_activite === 'inactif',
                                          'bg-gray-400': client.statut_activite === 'aucune'
                                      }"></span>
                                <span x-text="client.label_activite"></span>
                            </span>
                        </div>
                        <p class="text-sm text-gray-500 mt-1" x-text="client.secteur || 'Secteur d\'activité non renseigné'"></p>
                    </div>

                    <div class="flex items-center gap-2 text-sm text-gray-600">
                        <i data-lucide="mail" class="w-4 h-4 text-gray-400"></i>
                        <span x-text="client.contact_email || 'Aucun email renseigné'"></span>
                    </div>
                </div>
            </div>

            <!-- ============ 2. CARTES KPI DU COMPTE ============ -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Sessions suivies</p>
                    <p class="text-2xl font-bold text-gray-900" x-text="client.nb_sessions"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Salariés inscrits</p>
                    <p class="text-2xl font-bold text-gray-900" x-text="client.nb_participants"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Formations distinctes</p>
                    <p class="text-2xl font-bold text-gray-900" x-text="client.nb_formations"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Dernière activité</p>
                    <p class="text-2xl font-bold text-gray-900" x-text="client.derniere_activite"></p>
                </div>
            </div>

            <!-- ============ 3. PAVÉ POINT D'ATTENTION (SI INACTIF) ============ -->
            <template x-if="client.statut_activite === 'inactif'">
                <div class="bg-warning/5 border border-warning/30 rounded-xl p-4 flex items-start gap-3.5">
                    <div class="w-9 h-9 rounded-full bg-warning/15 flex items-center justify-center flex-shrink-0 mt-0.5">
                        <i data-lucide="alert-triangle" class="w-5 h-5 text-warning"></i>
                    </div>
                    <div>
                        <h4 class="text-sm font-semibold text-gray-900">Point d'attention — Compte inactif</h4>
                        <p class="text-xs text-gray-600 mt-0.5">
                            Ce client n'a enregistré aucune nouvelle inscription confirmée depuis
                            <strong x-text="client.mois_inactivite + ' mois'"></strong>. Un réengagement commercial peut être opportun.
                        </p>
                    </div>
                </div>
            </template>

            <!-- ============ 4. HISTORIQUE DES SESSIONS SUIVIES ============ -->
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                <div class="px-5 py-4 border-b border-gray-200 flex items-center justify-between">
                    <div>
                        <h3 class="text-sm font-semibold text-gray-900">Sessions de formation suivies</h3>
                        <p class="text-xs text-gray-500 mt-0.5">Historique des sessions auxquelles des salariés du client ont participé.</p>
                    </div>
                    <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-gray-100 text-gray-700"
                          x-text="(client.sessions_historique || []).length + ' session' + ((client.sessions_historique || []).length > 1 ? 's' : '')"></span>
                </div>

                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-200 text-left text-gray-500">
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Formation</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Dates</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide text-right">Salariés inscrits</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Statut</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-if="!client.sessions_historique || client.sessions_historique.length === 0">
                            <tr>
                                <td colspan="{{ 5 if current_user.role.nom in ['admin', 'gestionnaire'] else 4 }}" class="px-5 py-10 text-center text-gray-400 text-sm">
                                    <i data-lucide="calendar-x" class="w-6 h-6 mx-auto mb-2 text-gray-300"></i>
                                    Aucune session de formation enregistrée pour ce client.
                                </td>
                            </tr>
                        </template>

                        <template x-for="s in client.sessions_historique" :key="s.id">
                            <tr @click="window.location.assign('/sessions/' + s.id)" @keydown.enter="window.location.assign('/sessions/' + s.id)" tabindex="0" class="gtm-detail-row border-b border-gray-100 last:border-0">
                                <td class="px-5 py-4">
                                    <a @click.stop :href="`/formations/${s.formation_id}`" class="font-medium text-gray-900 hover:text-primary transition-colors" x-text="s.formation_titre"></a>
                                </td>
                                <td class="px-5 py-4 text-gray-700 text-xs" x-text="s.date_debut + ' → ' + s.date_fin"></td>
                                <td class="px-5 py-4 text-right">
                                    <span class="text-xs font-semibold px-2 py-0.5 rounded bg-gray-100 text-gray-800"
                                          x-text="s.nb_participants + ' salarié' + (s.nb_participants > 1 ? 's' : '')"></span>
                                </td>
                                <td class="px-5 py-4">
                                    <span class="text-xs font-medium px-2.5 py-1 rounded-full"
                                          :class="couleurStatutSession(s.statut)"
                                          x-text="labelStatutSession(s.statut)"></span>
                                </td>
                                <td class="px-5 py-4 text-right">
                                    <a @click.stop :href="`/sessions/${s.id}`" class="text-xs font-medium text-primary hover:text-primary-hover inline-flex items-center gap-1">
                                        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                        Voir la session
                                    </a>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- ============ 5. REPERTOIRE DES PARTICIPANTS DU CLIENT ============ -->
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                <div class="px-5 py-4 border-b border-gray-200 flex items-center justify-between">
                    <div>
                        <h3 class="text-sm font-semibold text-gray-900">Salariés rattachés</h3>
                        <p class="text-xs text-gray-500 mt-0.5">Participants enregistrés sous l'entité <span x-text="client.nom_entreprise"></span>.</p>
                    </div>
                    <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-primary/10 text-primary"
                          x-text="participants.length + ' participant' + (participants.length > 1 ? 's' : '')"></span>
                </div>
                {% if current_user.role.nom in ['admin', 'gestionnaire'] %}
                <div class="flex items-center justify-between gap-3 px-5 py-3 border-b border-gray-200 bg-slate-50">
                    <button type="button" @click="modeSelection = !modeSelection; selectionnees = []" class="gtm-btn gtm-btn-secondary text-xs">
                        <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
                        <span x-text="modeSelection ? 'Annuler' : 'Sélectionner'"></span>
                    </button>
                    <div x-show="modeSelection" class="flex items-center gap-2">
                        <input type="checkbox" @click="toggleSelectionGlobale()" :checked="selectionnees.length === participants.length && participants.length > 0" :indeterminate="selectionnees.length > 0 && selectionnees.length < participants.length" class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                        <span class="text-xs font-semibold text-slate-600">Tout sélectionner</span>
                    </div>
                    <button type="button" x-show="modeSelection && selectionnees.length > 0" @click="supprimerSelection()" :disabled="suppressionEnCours" class="gtm-btn gtm-btn-danger text-xs">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        Supprimer (<span x-text="selectionnees.length"></span>)
                    </button>
                </div>
                {% endif %}

                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-200 text-left text-gray-500">
                            {% if current_user.role.nom in ['admin', 'gestionnaire'] %}<th x-show="modeSelection" class="px-3 py-3 w-12"><span class="sr-only">Sélection</span></th>{% endif %}
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Nom</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Email</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide text-right">Activité</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-if="participants.length === 0">
                            <tr>
                                <td colspan="5" class="px-5 py-10 text-center text-gray-400 text-sm">
                                    <i data-lucide="users" class="w-6 h-6 mx-auto mb-2 text-gray-300"></i>
                                    Aucun salarié enregistré pour ce client.
                                </td>
                            </tr>
                        </template>

                        <template x-for="p in participants" :key="p.id">
                            <tr @click="window.location.assign('/participants/' + p.id)" @keydown.enter="window.location.assign('/participants/' + p.id)" tabindex="0" class="gtm-detail-row border-b border-gray-100 last:border-0">
                                {% if current_user.role.nom in ['admin', 'gestionnaire'] %}<td x-show="modeSelection" class="px-3 py-4"><input type="checkbox" :checked="selectionnees.includes(p.id)" @click.stop @change="toggleSelection(p.id)" class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500"></td>{% endif %}
                                <td class="px-5 py-4 font-medium text-gray-900" x-text="p.nom"></td>
                                <td class="px-5 py-4 text-gray-500 text-xs" x-text="p.email"></td>
                                <td class="px-5 py-4 text-right">
                                    <span class="text-xs font-medium text-gray-600 bg-gray-100 px-2 py-0.5 rounded"
                                          x-text="(p.nb_inscriptions || 0) + ' inscription' + ((p.nb_inscriptions || 0) > 1 ? 's' : '')"></span>
                                </td>
                                <td class="px-5 py-4 text-right">
                                    <a @click.stop :href="`/participants/${p.id}`" class="text-xs font-medium text-gray-600 hover:text-gray-900 inline-flex items-center gap-1">
                                        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                        Fiche participant
                                    </a>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

        </div>
    </template>

</div>

{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/client_detail.js') }}"></script>
{% endblock %}
