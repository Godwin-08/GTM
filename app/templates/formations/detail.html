{% extends "base.html" %}

{% block page_title %}Détail de la formation{% endblock %}

{% block content %}

<div x-data="pageFormationDetailData({{ formation_id }})" x-init="charger()">

    <a href="{{ url_for('pages.formations') }}" class="text-sm text-gray-500 hover:text-gray-700 flex items-center gap-1 mb-4">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Retour aux formations
    </a>

    <template x-if="chargementEnCours">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-10 text-center text-gray-400 text-sm">
            <i data-lucide="loader-2" class="w-5 h-5 mx-auto mb-2 animate-spin"></i>
            Chargement...
        </div>
    </template>

    <template x-if="erreur">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-10 text-center text-red-500 text-sm">
            <i data-lucide="alert-circle" class="w-5 h-5 mx-auto mb-2"></i>
            <span x-text="erreur"></span>
        </div>
    </template>

    <template x-if="!chargementEnCours && !erreur && formation">
        <div>
            <!-- ============ EN-TÊTE FORMATION ============ -->
            <div class="bg-white rounded-xl border border-gray-200 p-6 mb-6">
                <div class="flex items-start justify-between mb-3">
                    <h2 class="text-lg font-semibold text-gray-900" x-text="formation.titre"></h2>
                    <span class="text-xs font-medium px-2.5 py-1 rounded-full"
                          :class="couleurDomaine(formation.domaine.nom)"
                          x-text="formation.domaine.nom"></span>
                </div>

                <template x-if="formation.description">
                    <p class="text-sm text-gray-600 mb-4" x-text="formation.description"></p>
                </template>

                <div class="pt-4 border-t border-gray-100">
                    <p class="text-xs text-gray-400 uppercase tracking-wide mb-1">Durée</p>
                    <p class="text-sm text-gray-900" x-text="formation.duree_jours + ' jour' + (formation.duree_jours > 1 ? 's' : '')"></p>
                </div>
            </div>

            <!-- ============ TABLEAU DES SESSIONS ============ -->
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
                <div class="px-5 py-4 border-b border-gray-200">
                    <p class="text-sm font-medium text-gray-900">
                        Sessions — <span x-text="sessions.length"></span>
                    </p>
                </div>

                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-200 text-left text-gray-500">
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Dates</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Formateur</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Lieu</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Remplissage</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Statut</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-if="sessions.length === 0">
                            <tr><td colspan="5" class="px-5 py-10 text-center text-gray-400 text-sm">
                                Aucune session pour cette formation.
                            </td></tr>
                        </template>

                        <template x-for="s in sessionsTriees()" :key="s.id">
                            <tr class="border-b border-gray-100 last:border-0 hover:bg-gray-50 cursor-pointer"
                                @click="window.location.href = `/sessions/${s.id}`">
                                <td class="px-5 py-4 text-gray-700" x-text="formaterDate(s.date_debut) + ' → ' + formaterDate(s.date_fin)"></td>
                                <td class="px-5 py-4 text-gray-700" x-text="s.formateur.nom"></td>
                                <td class="px-5 py-4 text-gray-500 text-xs" x-text="s.lieu || '—'"></td>
                                <td class="px-5 py-4">
                                    <span class="text-xs font-medium px-2.5 py-1 rounded-full" :class="classeBadgeRemplissage(s)">
                                        <span x-text="s.nb_inscrits_confirmes"></span>/<span x-text="s.capacite_max"></span>
                                    </span>
                                </td>
                                <td class="px-5 py-4">
                                    <span class="text-xs font-medium px-2.5 py-1 rounded-full" :class="classeBadgeStatut(s.statut)" x-text="labelStatut(s.statut)"></span>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </div>
    </template>

</div>

{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/formation_detail.js') }}"></script>
{% endblock %}
