{% extends "base.html" %}

{% block page_title %}Détail de la formation{% endblock %}

{% block content %}

<div x-data="pageFormationDetailData({{ formation_id }})" x-init="charger()">

    <div class="mb-6 flex items-center justify-between">
        <a href="{{ url_for('pages.formations') }}" class="text-sm font-medium text-gray-500 hover:text-gray-900 flex items-center gap-1.5 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Retour à la liste des formations
        </a>
    </div>

    <template x-if="chargementEnCours">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-12 text-center text-gray-400 text-sm">
            <i data-lucide="loader-2" class="w-6 h-6 mx-auto mb-2 animate-spin"></i>
            Chargement de la formation...
        </div>
    </template>

    <template x-if="erreur">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-12 text-center text-red-500 text-sm">
            <i data-lucide="alert-circle" class="w-6 h-6 mx-auto mb-2"></i>
            <span x-text="erreur"></span>
        </div>
    </template>

    <template x-if="!chargementEnCours && !erreur && formation">
        <div class="space-y-6">

            <!-- ============ 1. EN-TÊTE FORMATION ============ -->
            <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-3">
                            <h1 class="text-xl font-bold text-gray-900" x-text="formation.titre"></h1>
                            <span class="text-xs font-medium px-2.5 py-1 rounded-full"
                                  :class="couleurDomaine(formation.domaine.nom)"
                                  x-text="formation.domaine.nom"></span>
                        </div>
                        <template x-if="formation.description">
                            <p class="text-sm text-gray-600 mt-2 max-w-3xl" x-text="formation.description"></p>
                        </template>
                    </div>
                </div>
            </div>

            <!-- ============ 2. CARTES KPI DE LA FORMATION ============ -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Domaine</p>
                    <p class="text-sm font-semibold text-gray-900" x-text="formation.domaine.nom"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Durée</p>
                    <p class="text-sm font-semibold text-gray-900" x-text="formation.duree_jours + ' jour' + (formation.duree_jours > 1 ? 's' : '')"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Sessions organisées</p>
                    <p class="text-2xl font-bold text-gray-900" x-text="sessions.length"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Stagiaires formés</p>
                    <p class="text-2xl font-bold text-gray-900" x-text="sessions.reduce((acc, s) => acc + (s.nb_inscrits_confirmes || 0), 0)"></p>
                </div>
            </div>

            <!-- ============ 3. HISTORIQUE DES SESSIONS ============ -->
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                <div class="px-5 py-4 border-b border-gray-200 flex items-center justify-between">
                    <div>
                        <h3 class="text-sm font-semibold text-gray-900">Sessions organisées</h3>
                        <p class="text-xs text-gray-500 mt-0.5">Historique des sessions de formation planifiées, en cours et terminées.</p>
                    </div>
                    <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-primary/10 text-primary"
                          x-text="sessions.length + ' session' + (sessions.length > 1 ? 's' : '')"></span>
                </div>

                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-200 text-left text-gray-500">
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Dates</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Formateur</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Lieu</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide text-right">Remplissage</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Statut</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-if="sessions.length === 0">
                            <tr>
                                <td colspan="6" class="px-5 py-12 text-center text-gray-400 text-sm">
                                    <i data-lucide="calendar-x" class="w-8 h-8 mx-auto mb-2 text-gray-300"></i>
                                    <p class="font-medium text-gray-700 mb-0.5">Aucune session planifiée</p>
                                    <p class="text-xs text-gray-400">Cette formation n'a pas encore été programmée dans une session.</p>
                                </td>
                            </tr>
                        </template>

                        <template x-for="s in sessionsTriees()" :key="s.id">
                            <tr class="border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors">
                                <td class="px-5 py-4 text-gray-700 font-medium text-xs" x-text="formaterDate(s.date_debut) + ' → ' + formaterDate(s.date_fin)"></td>
                                <td class="px-5 py-4 text-gray-900 font-medium" x-text="s.formateur ? s.formateur.nom : '—'"></td>
                                <td class="px-5 py-4 text-gray-500 text-xs" x-text="s.lieu || '—'"></td>
                                <td class="px-5 py-4 text-right">
                                    <span class="text-xs font-medium px-2.5 py-1 rounded-full" :class="classeBadgeRemplissage(s)">
                                        <span x-text="s.nb_inscrits_confirmes"></span>/<span x-text="s.capacite_max"></span>
                                    </span>
                                </td>
                                <td class="px-5 py-4">
                                    <span class="text-xs font-medium px-2.5 py-1 rounded-full" :class="classeBadgeStatut(s.statut)" x-text="labelStatut(s.statut)"></span>
                                </td>
                                <td class="px-5 py-4 text-right">
                                    <a :href="`/sessions/${s.id}`" class="text-xs font-medium text-primary hover:text-primary-hover inline-flex items-center gap-1">
                                        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                        Voir la session
                                    </a>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

        </div>
    </template>

</div>

{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/formation_detail.js') }}"></script>
{% endblock %}
