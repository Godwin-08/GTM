{% extends "base.html" %}

{% block page_title %}Détail du participant{% endblock %}

{% block content %}

<div x-data="pageParticipantDetailData({{ participant_id }})" x-init="charger()">

    <div class="mb-6 flex items-center justify-between">
        <a href="{{ url_for('pages.participants') }}" class="text-sm font-medium text-gray-500 hover:text-gray-900 flex items-center gap-1.5 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Retour à la liste des participants
        </a>
    </div>

    <template x-if="chargementEnCours">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-12 text-center text-gray-400 text-sm">
            <i data-lucide="loader-2" class="w-6 h-6 mx-auto mb-2 animate-spin"></i>
            Chargement du profil participant...
        </div>
    </template>

    <template x-if="erreur">
        <div class="bg-white rounded-xl border border-gray-200 px-5 py-12 text-center text-red-500 text-sm">
            <i data-lucide="alert-circle" class="w-6 h-6 mx-auto mb-2"></i>
            <span x-text="erreur"></span>
        </div>
    </template>

    <template x-if="!chargementEnCours && !erreur && participant">
        <div class="space-y-6">

            <!-- ============ 1. EN-TÊTE PARTICIPANT ============ -->
            <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
                <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                    <div>
                        <div class="flex items-center gap-3">
                            <h1 class="text-xl font-bold text-gray-900" x-text="participant.nom"></h1>
                            <template x-if="participant.client">
                                <a :href="`/clients/${participant.client.id}`"
                                   class="text-xs font-medium px-2.5 py-1 rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors"
                                   x-text="participant.client.nom_entreprise"></a>
                            </template>
                        </div>
                        <p class="text-sm text-gray-500 mt-1 flex items-center gap-1.5">
                            <i data-lucide="mail" class="w-3.5 h-3.5 text-gray-400"></i>
                            <span x-text="participant.email"></span>
                        </p>
                    </div>
                </div>
            </div>

            <!-- ============ 2. CARTES KPI DU PARTICIPANT ============ -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Entreprise rattachée</p>
                    <p class="text-sm font-semibold text-gray-900" x-text="participant.client ? participant.client.nom_entreprise : '—'"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Inscriptions totales</p>
                    <p class="text-2xl font-bold text-gray-900" x-text="inscriptions.length"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Formations distinctes</p>
                    <p class="text-2xl font-bold text-gray-900" x-text="new Set(inscriptions.map(i => i.session?.formation_id).filter(Boolean)).size"></p>
                </div>
                <div class="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-1">Dernière inscription</p>
                    <p class="text-sm font-semibold text-gray-900" x-text="inscriptions.length > 0 ? formaterDate(inscriptions[0].date_inscription) : '—'"></p>
                </div>
            </div>

            <!-- ============ 3. TABLEAU DES INSCRIPTIONS AUX SESSIONS ============ -->
            <div class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                <div class="px-5 py-4 border-b border-gray-200 flex items-center justify-between gap-3">
                    <div>
                        <h3 class="text-sm font-semibold text-gray-900">Sessions et formations suivies</h3>
                        <p class="text-xs text-gray-500 mt-0.5">Historique complet des inscriptions de <span x-text="participant.nom"></span>.</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-primary/10 text-primary"
                              x-text="inscriptions.length + ' inscription' + (inscriptions.length > 1 ? 's' : '')"></span>
                    </div>
                </div>
                {% if current_user.role.nom in ['admin', 'gestionnaire'] %}
                <div class="flex items-center justify-between gap-3 px-5 py-3 border-b border-gray-200 bg-slate-50">
                    <button type="button" @click="basculerModeSelection()" class="gtm-btn gtm-btn-secondary text-xs">
                        <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
                        <span x-text="modeSelection ? 'Annuler' : 'Sélectionner'"></span>
                    </button>
                    <div x-show="modeSelection" class="flex items-center gap-2">
                        <input type="checkbox" @click="toggleSelectionGlobale()" :checked="selectionnees.length === inscriptions.length && inscriptions.length > 0" :indeterminate="selectionnees.length > 0 && selectionnees.length < inscriptions.length" class="h-4 w-4 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                        <span class="text-xs font-semibold text-slate-600">Tout sélectionner</span>
                    </div>
                    <button type="button" x-show="modeSelection && selectionnees.length > 0" @click="supprimerSelection()" :disabled="suppressionEnCours" class="gtm-btn gtm-btn-danger text-xs">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        Supprimer (<span x-text="selectionnees.length"></span>)
                    </button>
                </div>
                {% endif %}

                <table class="w-full text-sm">
                    <thead>
                        <tr class="border-b border-gray-200 text-left text-gray-500">
                            {% if current_user.role.nom in ['admin', 'gestionnaire'] %}<th x-show="modeSelection" class="px-5 py-3 font-medium text-xs uppercase tracking-wide w-12">
                                <input type="checkbox"
                                       @click="toggleSelectionGlobale()"
                                       :checked="selectionnees.length === inscriptions.length && inscriptions.length > 0"
                                       :indeterminate="selectionnees.length > 0 && selectionnees.length < inscriptions.length"
                                       class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary" />
                            </th>{% endif %}
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Formation</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Dates de session</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide text-right">Inscrit le</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide">Statut</th>
                            <th class="px-5 py-3 font-medium text-xs uppercase tracking-wide text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-if="inscriptions.length === 0">
                            <tr>
                                <td colspan="{{ 6 if current_user.role.nom in ['admin', 'gestionnaire'] else 5 }}" class="px-5 py-12 text-center text-gray-400 text-sm">
                                    <i data-lucide="user-x" class="w-8 h-8 mx-auto mb-2 text-gray-300"></i>
                                    <p class="font-medium text-gray-700 mb-0.5">Aucune inscription</p>
                                    <p class="text-xs text-gray-400">Ce participant n'a encore été inscrit à aucune session de formation.</p>
                                </td>
                            </tr>
                        </template>

                        <template x-for="i in inscriptions" :key="i.id">
                            <tr @click="window.location.assign('/sessions/' + i.session.id)" @keydown.enter="window.location.assign('/sessions/' + i.session.id)" tabindex="0" class="gtm-detail-row border-b border-gray-100 last:border-0">
                                {% if current_user.role.nom in ['admin', 'gestionnaire'] %}<td x-show="modeSelection" class="px-5 py-4">
                                    <input type="checkbox"
                                           :value="i.id"
                                           :checked="selectionnees.includes(i.id)"
                                           @click.stop @change="toggleSelection(i.id)"
                                           class="h-4 w-4 rounded border-gray-300 text-primary focus:ring-primary" />
                                </td>{% endif %}
                                <td class="px-5 py-4">
                                    <template x-if="i.session && i.session.formation">
                                        <div>
                                               <a @click.stop :href="`/formations/${i.session.formation.id}`"
                                               class="font-medium text-gray-900 hover:text-primary transition-colors"
                                               x-text="i.session.formation.titre"></a>
                                            <p class="text-xs text-gray-500 mt-0.5"
                                               x-text="i.session.formateur ? 'Formateur: ' + i.session.formateur.nom : ''"></p>
                                        </div>
                                    </template>
                                    <template x-if="!i.session || !i.session.formation">
                                        <p class="font-medium text-gray-900" x-text="'Session #' + i.session_id"></p>
                                    </template>
                                </td>
                                <td class="px-5 py-4 text-gray-700 text-xs"
                                    x-text="i.session ? (formaterDate(i.session.date_debut) + ' → ' + formaterDate(i.session.date_fin)) : '—'"></td>
                                <td class="px-5 py-4 text-right text-xs text-gray-600" x-text="formaterDate(i.date_inscription)"></td>
                                <td class="px-5 py-4">
                                    <span class="text-xs font-medium px-2.5 py-1 rounded-full"
                                          :class="classeBadgeInscription(i.statut)"
                                          x-text="labelInscription(i.statut)"></span>
                                </td>
                                <td class="px-5 py-4 text-right">
                                    <div class="flex items-center justify-end gap-2">
                                        <template x-if="i.session">
                                               <a @click.stop :href="`/sessions/${i.session.id}`" class="text-xs font-medium text-primary hover:text-primary-hover inline-flex items-center gap-1">
                                                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                                                Voir la session
                                            </a>
                                        </template>
                                        {% if current_user.role.nom in ['admin', 'gestionnaire'] %}<button type="button"
                                            @click.stop="supprimerInscription(i.id)"
                                                class="inline-flex items-center gap-1 px-2 py-1.5 rounded-md border border-red-200 bg-red-50 text-red-600 hover:bg-red-100 transition-colors text-xs font-medium"
                                                title="Supprimer l'inscription">
                                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                            Supprimer
                                        </button>{% endif %}
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

        </div>
    </template>

</div>

{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/participant_detail.js') }}"></script>
{% endblock %}
